<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="640" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">什么是"一轮"（turn）：user 消息开启一轮，直到下一次 user 消息</text>

  <!-- Turn 1 box -->
  <rect x="30" y="60" width="760" height="130" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7,4"/>
  <text x="50" y="84" font-size="13" font-weight="600" fill="#64748b">第 1 轮（从 user 开始）</text>

  <!-- user message -->
  <rect x="50" y="100" width="140" height="52" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="120" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">user</text>
  <text x="120" y="140" text-anchor="middle" font-size="11" fill="#1e293b">帮我写个排序函数</text>

  <line x1="195" y1="126" x2="218" y2="126" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- assistant (toolCall) -->
  <rect x="222" y="100" width="150" height="52" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="297" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">assistant</text>
  <text x="297" y="140" text-anchor="middle" font-size="11" fill="#1e293b">toolCall: write_file</text>

  <line x1="377" y1="126" x2="400" y2="126" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- toolResult -->
  <rect x="404" y="100" width="140" height="52" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="474" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">toolResult</text>
  <text x="474" y="140" text-anchor="middle" font-size="11" fill="#1e293b">已写入 sort.ts</text>

  <line x1="549" y1="126" x2="572" y2="126" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- assistant (text) -->
  <rect x="576" y="100" width="190" height="52" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="671" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">assistant</text>
  <text x="671" y="140" text-anchor="middle" font-size="11" fill="#1e293b">排序函数已写好</text>

  <!-- Pairing bracket: toolCall ↔ toolResult -->
  <path d="M 297 160 L 297 172 L 474 172 L 474 160" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="385" y="188" text-anchor="middle" font-size="11" font-weight="600" fill="#ef4444">toolCall / toolResult 永远配对，拆开 = 孤儿 tool（DeepSeek 400 真实事故）</text>

  <!-- Turn 2 box -->
  <rect x="810" y="60" width="440" height="130" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="7,4"/>
  <text x="830" y="84" font-size="13" font-weight="600" fill="#64748b">第 2 轮（新的 user 消息 = 新轮）</text>

  <!-- user message -->
  <rect x="840" y="100" width="140" height="52" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="910" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">user</text>
  <text x="910" y="140" text-anchor="middle" font-size="11" fill="#1e293b">改成降序</text>

  <line x1="985" y1="126" x2="1008" y2="126" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- assistant -->
  <rect x="1012" y="100" width="210" height="52" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="1117" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">assistant</text>
  <text x="1117" y="140" text-anchor="middle" font-size="11" fill="#1e293b">好的，我来修改</text>

  <!-- transition arrow between turns -->
  <line x1="770" y1="126" x2="808" y2="126" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="789" y="118" text-anchor="middle" font-size="10" fill="#64748b">新轮</text>

  <!-- Key takeaways -->
  <rect x="30" y="220" width="1220" height="155" rx="12" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="55" y="250" font-size="14" font-weight="700" fill="#92400e">关键概念</text>

  <circle cx="50" cy="280" r="5" fill="#3b82f6"/>
  <text x="65" y="285" font-size="13" fill="#1e293b">消息有三种角色：user（人）/ assistant（模型）/ toolResult（工具执行器）</text>

  <circle cx="50" cy="308" r="5" fill="#ef4444"/>
  <text x="65" y="313" font-size="13" fill="#1e293b">一轮（turn）以 user 消息开启；assistant(toolCall) 和 toolResult 永远配对，拆开 = 孤儿 tool</text>

  <circle cx="50" cy="336" r="5" fill="#8b5cf6"/>
  <text x="65" y="341" font-size="13" fill="#1e293b">pi 压缩时"回退到轮起点"找的就是 user 消息边界 — 这就是后面"三把剪刀"切点约束的基础</text>

  <!-- Role legend -->
  <rect x="900" y="245" width="14" height="14" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="920" y="256" font-size="11" fill="#64748b">user</text>
  <rect x="960" y="245" width="14" height="14" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <text x="980" y="256" font-size="11" fill="#64748b">assistant</text>
  <rect x="1050" y="245" width="14" height="14" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1070" y="256" font-size="11" fill="#64748b">toolResult</text>
</svg>
