<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="a7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="640" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">DSH 三条数据流（核心中的核心）</text>

  <!-- Lane 1: 写入 -->
  <rect x="20" y="50" width="1240" height="100" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <rect x="20" y="50" width="120" height="100" rx="12" fill="#10b981"/>
  <text x="80" y="95" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">写入</text>
  <text x="80" y="115" text-anchor="middle" font-size="11" fill="#d1fae5">一条新消息</text>
  <text x="80" y="130" text-anchor="middle" font-size="11" fill="#d1fae5">进会话</text>

  <rect x="155" y="65" width="160" height="42" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="235" y="84" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">① 校验</text>
  <text x="235" y="99" text-anchor="middle" font-size="9" fill="#065f46">validateNext(event)</text>

  <line x1="320" y1="86" x2="340" y2="86" stroke="#94a3b8" stroke-width="2" marker-end="url(#a7)"/>

  <rect x="345" y="65" width="170" height="42" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="430" y="84" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">② 落内存</text>
  <text x="430" y="99" text-anchor="middle" font-size="9" fill="#065f46">log.push(event)</text>

  <line x1="520" y1="86" x2="540" y2="86" stroke="#94a3b8" stroke-width="2" marker-end="url(#a7)"/>

  <rect x="545" y="65" width="190" height="42" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="640" y="84" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">③ 广播</text>
  <text x="640" y="99" text-anchor="middle" font-size="9" fill="#065f46">发 session/event 事件</text>

  <line x1="740" y1="86" x2="760" y2="86" stroke="#94a3b8" stroke-width="2" marker-end="url(#a7)"/>

  <rect x="765" y="65" width="220" height="42" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="875" y="84" text-anchor="middle" font-size="11" font-weight="600" fill="#b45309">持久化插件</text>
  <text x="875" y="99" text-anchor="middle" font-size="9" fill="#92400e">追加写磁盘 JSONL 文件</text>

  <rect x="1005" y="68" width="240" height="36" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="1125" y="90" text-anchor="middle" font-size="10" fill="#991b1b">⚠ 视图此刻不变！</text>

  <!-- Lane 2: 读取 -->
  <rect x="20" y="165" width="1240" height="100" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="20" y="165" width="120" height="100" rx="12" fill="#3b82f6"/>
  <text x="80" y="210" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">读取</text>
  <text x="80" y="230" text-anchor="middle" font-size="11" fill="#dbeafe">给模型拼</text>
  <text x="80" y="245" text-anchor="middle" font-size="11" fill="#dbeafe">上下文</text>

  <rect x="155" y="180" width="190" height="42" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="250" y="199" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">① surface.nodes</text>
  <text x="250" y="214" text-anchor="middle" font-size="9" fill="#1e40af">惰性折叠 delta（若有新增）</text>

  <line x1="350" y1="201" x2="370" y2="201" stroke="#94a3b8" stroke-width="2" marker-end="url(#a7)"/>

  <rect x="375" y="180" width="200" height="42" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="475" y="199" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">② log[seq] 取事件</text>
  <text x="475" y="214" text-anchor="middle" font-size="9" fill="#1e40af">对每个可见 seq</text>

  <line x1="580" y1="201" x2="600" y2="201" stroke="#94a3b8" stroke-width="2" marker-end="url(#a7)"/>

  <rect x="605" y="180" width="210" height="42" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="710" y="199" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">③ 投影成 Message</text>
  <text x="710" y="214" text-anchor="middle" font-size="9" fill="#1e40af">deriveEventMessage，带缓存</text>

  <rect x="835" y="180" width="200" height="42" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="935" y="199" text-anchor="middle" font-size="11" font-weight="600" fill="#15803d">发给模型</text>
  <text x="935" y="214" text-anchor="middle" font-size="9" fill="#166534">上下文拼装完成</text>

  <rect x="1055" y="183" width="190" height="36" rx="8" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="1150" y="205" text-anchor="middle" font-size="10" fill="#7c3aed">✅ 视图此时才更新</text>

  <!-- Lane 3: 恢复 -->
  <rect x="20" y="280" width="1240" height="100" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <rect x="20" y="280" width="120" height="100" rx="12" fill="#f59e0b"/>
  <text x="80" y="325" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">恢复</text>
  <text x="80" y="345" text-anchor="middle" font-size="11" fill="#fef3c7">电脑重启</text>
  <text x="80" y="360" text-anchor="middle" font-size="11" fill="#fef3c7">后重建</text>

  <rect x="155" y="295" width="200" height="42" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="255" y="314" text-anchor="middle" font-size="11" font-weight="600" fill="#b45309">① 磁盘文件读回</text>
  <text x="255" y="329" text-anchor="middle" font-size="9" fill="#92400e">全部事件（JSONL）</text>

  <line x1="360" y1="316" x2="380" y2="316" stroke="#94a3b8" stroke-width="2" marker-end="url(#a7)"/>

  <rect x="385" y="295" width="200" height="42" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="485" y="314" text-anchor="middle" font-size="11" font-weight="600" fill="#b45309">② seed 构造 Session</text>
  <text x="485" y="329" text-anchor="middle" font-size="9" fill="#92400e">log 重新填满</text>

  <line x1="590" y1="316" x2="610" y2="316" stroke="#94a3b8" stroke-width="2" marker-end="url(#a7)"/>

  <rect x="615" y="295" width="220" height="42" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="725" y="314" text-anchor="middle" font-size="11" font-weight="600" fill="#b45309">③ 首次访问 surface</text>
  <text x="725" y="329" text-anchor="middle" font-size="9" fill="#92400e">全量折叠一次 = O(N)</text>

  <line x1="840" y1="316" x2="860" y2="316" stroke="#94a3b8" stroke-width="2" marker-end="url(#a7)"/>

  <rect x="865" y="295" width="200" height="42" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="2"/>
  <text x="965" y="314" text-anchor="middle" font-size="11" font-weight="600" fill="#15803d">④ 之后恢复增量</text>
  <text x="965" y="329" text-anchor="middle" font-size="9" fill="#166534">O(新增)，不是 O(全部)</text>

  <rect x="1085" y="298" width="160" height="36" rx="8" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="1165" y="320" text-anchor="middle" font-size="10" fill="#7c3aed">顺序即状态</text>

  <!-- Key insight -->
  <rect x="20" y="400" width="1240" height="105" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="40" y="425" font-size="13" font-weight="700" fill="#92400e">关键设计：写时只校验、读时才应用</text>
  <circle cx="35" cy="448" r="4" fill="#f59e0b"/>
  <text x="48" y="452" font-size="12" fill="#1e293b">写路径零成本：append 时只调 validateNext 校验（fail-fast），坏事件在 append 处抛错进不了日志，但不动视图</text>
  <circle cx="35" cy="470" r="4" fill="#f59e0b"/>
  <text x="48" y="474" font-size="12" fill="#1e293b">读路径按需补算：访问 surface.nodes / deriveMessages() 时，发现 log 有新增才 _processDelta() 折叠应用</text>
  <circle cx="35" cy="492" r="4" fill="#f59e0b"/>
  <text x="48" y="496" font-size="12" fill="#1e293b">压缩事务 append(start→summary→replace→end) 全都只做校验，真正让视图变的是事务后第一次有人读 surface</text>
</svg>
