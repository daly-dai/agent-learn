<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="a13" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="640" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">存储模型决定设计：我们为什么"不抄" pi 的 retainedTail</text>

  <!-- pi column -->
  <rect x="20" y="50" width="600" height="240" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <rect x="20" y="50" width="600" height="32" rx="12" fill="#10b981"/>
  <rect x="20" y="65" width="600" height="17" fill="#10b981"/>
  <text x="320" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">pi（物理删除）</text>

  <!-- pi: before compaction -->
  <rect x="50" y="95" width="540" height="30" rx="6" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="320" y="114" text-anchor="middle" font-size="11" fill="#166534">会话日志：msg1 | msg2 | … | msg200</text>

  <!-- arrow down -->
  <line x1="320" y1="130" x2="320" y2="142" stroke="#10b981" stroke-width="2" marker-end="url(#a13)"/>
  <text x="345" y="140" font-size="9" fill="#64748b">压缩</text>

  <!-- pi: after compaction -->
  <rect x="50" y="148" width="140" height="30" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="120" y="167" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">compaction</text>

  <text x="200" y="167" font-size="11" fill="#64748b">+</text>

  <rect x="215" y="148" width="120" height="30" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="275" y="167" text-anchor="middle" font-size="11" font-weight="600" fill="#b45309">retainedTail</text>
  <text x="275" y="178" text-anchor="middle" font-size="9" fill="#92400e">内联拷贝近尾</text>

  <text x="345" y="167" font-size="11" fill="#64748b">+</text>

  <rect x="360" y="148" width="230" height="30" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="475" y="167" text-anchor="middle" font-size="11" font-weight="600" fill="#15803d">最近 ~20k tokens 原文</text>

  <!-- pi annotation -->
  <rect x="50" y="190" width="540" height="85" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="65" y="212" font-size="12" font-weight="600" fill="#991b1b">为什么 pi 需要 retainedTail？</text>
  <text x="65" y="232" font-size="11" fill="#1e293b">被压的旧消息物理删除了 → 保留区消息没了 → 必须把近尾消息</text>
  <text x="65" y="247" font-size="11" fill="#1e293b">内联拷贝进 compaction entry（retainedTail），否则删了就没了</text>
  <text x="65" y="267" font-size="11" fill="#64748b" font-style="italic">代价：文件不膨胀（删了就没了）　好处：—</text>

  <!-- 我们 column -->
  <rect x="640" y="50" width="620" height="240" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="640" y="50" width="620" height="32" rx="12" fill="#3b82f6"/>
  <rect x="640" y="65" width="620" height="17" fill="#3b82f6"/>
  <text x="950" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">我们 agent-learn（只追加不删）</text>

  <!-- us: before compaction -->
  <rect x="670" y="95" width="560" height="30" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="950" y="114" text-anchor="middle" font-size="11" fill="#1e40af">JSONL 文件：msg1 | msg2 | … | msg200（只追加）</text>

  <line x1="950" y1="130" x2="950" y2="142" stroke="#3b82f6" stroke-width="2" marker-end="url(#a13)"/>
  <text x="975" y="140" font-size="9" fill="#64748b">压缩</text>

  <!-- us: after compaction -->
  <rect x="670" y="148" width="560" height="30" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="680" y="167" font-size="11" fill="#64748b">msg1…msg200 仍在文件（只追加不删）</text>
  <rect x="950" y="143" width="280" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="1090" y="160" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">+ append compaction entry</text>
  <text x="1090" y="175" text-anchor="middle" font-size="9" fill="#1e40af">firstKeptEntryId 指针定位</text>

  <!-- us: what model sees -->
  <rect x="670" y="148" width="140" height="30" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" opacity="0.3"/>
  <text x="740" y="167" text-anchor="middle" font-size="10" fill="#1d4ed8">摘要</text>
  <text x="820" y="167" font-size="11" fill="#64748b">+</text>
  <rect x="835" y="148" width="115" height="30" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5" opacity="0.3"/>
  <text x="892" y="167" text-anchor="middle" font-size="10" fill="#15803d">最近N条原文</text>

  <!-- us annotation -->
  <rect x="670" y="190" width="560" height="85" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="685" y="212" font-size="12" font-weight="600" fill="#047857">为什么我们不需要 retainedTail？</text>
  <text x="685" y="232" font-size="11" fill="#1e293b">消息还在文件里（只追加不删）→ 用 firstKeptEntryId（一个指针）</text>
  <text x="685" y="247" font-size="11" fill="#1e293b">就能定位"从哪开始保留"，不需要把消息拷贝一份</text>
  <text x="685" y="267" font-size="11" fill="#64748b" font-style="italic">代价：文件一直长大（教学无所谓）　好处：原始数据永远在，可回放、可审计</text>

  <!-- Bottom conclusion -->
  <rect x="20" y="310" width="1240" height="80" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="640" y="335" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">结论：抄别人的设计要抄思想，不是抄表面</text>
  <text x="640" y="358" text-anchor="middle" font-size="12" fill="#92400e">pi 需要 retainedTail 是因为它"删"，我们不删所以不需要。先看人家的存储模型和你一不一样。</text>
  <text x="640" y="378" text-anchor="middle" font-size="11" fill="#64748b">压缩后旧消息还在吗？→ 在。JSONL 只追加不删，被压消息永远在文件里，buildContext 只是过滤掉它们。</text>
</svg>
