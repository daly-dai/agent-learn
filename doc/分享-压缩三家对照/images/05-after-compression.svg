<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arr5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arr5b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arr5g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
    <marker id="arr5o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="640" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">图三：压缩后"模型看到什么"（保留策略对比）</text>

  <!-- Before box -->
  <rect x="20" y="45" width="1240" height="62" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="40" y="68" font-size="13" font-weight="700" fill="#475569">压缩前（模型看到全部 12 条）</text>
  <!-- 12 small colored cells -->
  <rect x="449" y="75" width="30" height="20" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="464" y="89" text-anchor="middle" font-size="9" fill="#1d4ed8">1</text>
  <rect x="481" y="75" width="30" height="20" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <text x="496" y="89" text-anchor="middle" font-size="9" fill="#047857">2</text>
  <rect x="513" y="75" width="30" height="20" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <text x="528" y="89" text-anchor="middle" font-size="9" fill="#047857">3</text>
  <rect x="545" y="75" width="30" height="20" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="560" y="89" text-anchor="middle" font-size="9" fill="#b45309">4</text>
  <rect x="577" y="75" width="30" height="20" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <text x="592" y="89" text-anchor="middle" font-size="9" fill="#047857">5</text>
  <rect x="609" y="75" width="30" height="20" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="624" y="89" text-anchor="middle" font-size="9" fill="#b45309">6</text>
  <rect x="641" y="75" width="30" height="20" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <text x="656" y="89" text-anchor="middle" font-size="9" fill="#047857">7</text>
  <rect x="673" y="75" width="30" height="20" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="688" y="89" text-anchor="middle" font-size="9" fill="#b45309">8</text>
  <rect x="705" y="75" width="30" height="20" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <text x="720" y="89" text-anchor="middle" font-size="9" fill="#047857">9</text>
  <rect x="737" y="75" width="30" height="20" rx="3" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="752" y="89" text-anchor="middle" font-size="9" fill="#1d4ed8">10</text>
  <rect x="769" y="75" width="30" height="20" rx="3" fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
  <text x="784" y="89" text-anchor="middle" font-size="9" fill="#047857">11</text>
  <rect x="801" y="75" width="30" height="20" rx="3" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="816" y="89" text-anchor="middle" font-size="9" fill="#b45309">12</text>
  <text x="860" y="89" font-size="11" fill="#94a3b8">全量消息发给模型</text>

  <!-- Three arrows down -->
  <path d="M 215 115 L 215 138" fill="none" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr5b)"/>
  <path d="M 625 115 L 625 138" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr5g)"/>
  <path d="M 1035 115 L 1035 138" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arr5o)"/>
  <text x="215" y="131" text-anchor="middle" font-size="10" fill="#3b82f6">压缩</text>
  <text x="625" y="131" text-anchor="middle" font-size="10" fill="#10b981">压缩</text>
  <text x="1035" y="131" text-anchor="middle" font-size="10" fill="#f59e0b">压缩</text>

  <!-- Panel 1: 我们 -->
  <rect x="20" y="145" width="390" height="250" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="20" y="145" width="390" height="32" rx="12" fill="#3b82f6"/>
  <text x="215" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">压缩后 · 我们</text>

  <!-- Summary box -->
  <rect x="40" y="188" width="350" height="75" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="55" y="207" font-size="12" font-weight="700" fill="#1d4ed8">compactionSummary 消息</text>
  <text x="55" y="225" font-size="11" fill="#1e40af">## Goal / Progress / Next Steps</text>
  <text x="55" y="243" font-size="11" fill="#1e40af">+ UPDATE 增量（previousSummary 递归）</text>
  <text x="55" y="258" font-size="10" fill="#64748b" font-style="italic">独立消息类型，不是 user</text>

  <!-- Arrow -->
  <line x1="215" y1="268" x2="215" y2="280" stroke="#3b82f6" stroke-width="2" marker-end="url(#arr5b)"/>

  <!-- Tail box -->
  <rect x="40" y="285" width="350" height="58" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="55" y="304" font-size="12" font-weight="700" fill="#15803d">最近 N 条原文</text>
  <text x="55" y="322" font-size="11" fill="#166534">assistant/tool 都在，完整保留</text>
  <text x="55" y="337" font-size="10" fill="#64748b">从 firstKeptEntryId 开始拼</text>

  <!-- Panel 2: pi -->
  <rect x="430" y="145" width="390" height="250" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <rect x="430" y="145" width="390" height="32" rx="12" fill="#10b981"/>
  <text x="625" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">压缩后 · pi</text>

  <rect x="450" y="188" width="350" height="75" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="465" y="207" font-size="12" font-weight="700" fill="#047857">compactionSummary 消息</text>
  <text x="465" y="225" font-size="11" fill="#065f46">六段结构化 + split-turn 的 Turn Context</text>
  <text x="465" y="243" font-size="11" fill="#065f46">+ previousSummary 递归 + details 文件清单</text>
  <text x="465" y="258" font-size="10" fill="#64748b" font-style="italic">独立摘要类消息，不进缓存</text>

  <line x1="625" y1="268" x2="625" y2="280" stroke="#10b981" stroke-width="2" marker-end="url(#arr5g)"/>

  <rect x="450" y="285" width="350" height="58" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="465" y="304" font-size="12" font-weight="700" fill="#15803d">原始 tail ≈20k tokens</text>
  <text x="465" y="322" font-size="11" fill="#166534">retainedTail 内联拷贝</text>
  <text x="465" y="337" font-size="10" fill="#64748b">或 firstKeptEntryId 指针定位</text>

  <!-- Panel 3: DSH -->
  <rect x="840" y="145" width="390" height="250" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <rect x="840" y="145" width="390" height="32" rx="12" fill="#f59e0b"/>
  <text x="1035" y="166" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">压缩后 · DSH</text>

  <rect x="860" y="188" width="350" height="75" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="875" y="207" font-size="12" font-weight="700" fill="#b45309">检查点消息</text>
  <text x="875" y="225" font-size="11" fill="#92400e">CHECKPOINT_PREAMBLE</text>
  <text x="875" y="243" font-size="11" fill="#92400e">+ &lt;compacted-summary&gt; 标签</text>
  <text x="875" y="258" font-size="10" fill="#64748b" font-style="italic">user/message + replace 事件（带 preamble）</text>

  <line x1="1035" y1="268" x2="1035" y2="280" stroke="#f59e0b" stroke-width="2" marker-end="url(#arr5o)"/>

  <rect x="860" y="285" width="350" height="58" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="875" y="304" font-size="12" font-weight="700" fill="#15803d">≈16% 窗口的 surface 尾部</text>
  <text x="875" y="322" font-size="11" fill="#166534">surface 派生视图尾部</text>
  <text x="875" y="337" font-size="10" fill="#64748b">永远单块，不递归</text>

  <!-- Comparison table -->
  <rect x="20" y="410" width="1240" height="140" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="40" y="432" font-size="13" font-weight="700" fill="#475569">保留策略对照</text>

  <!-- Header -->
  <rect x="40" y="440" width="280" height="24" rx="4" fill="#e2e8f0"/>
  <text x="180" y="456" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">维度</text>
  <rect x="325" y="440" width="290" height="24" rx="4" fill="#dbeafe"/>
  <text x="470" y="456" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">我们</text>
  <rect x="620" y="440" width="290" height="24" rx="4" fill="#d1fae5"/>
  <text x="765" y="456" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">pi</text>
  <rect x="915" y="440" width="290" height="24" rx="4" fill="#fef3c7"/>
  <text x="1060" y="456" text-anchor="middle" font-size="11" font-weight="600" fill="#b45309">DSH</text>

  <!-- Row 1 -->
  <text x="180" y="480" text-anchor="middle" font-size="10" fill="#1e293b">摘要身份</text>
  <text x="470" y="480" text-anchor="middle" font-size="10" fill="#1e293b">独立 compactionSummary 类型</text>
  <text x="765" y="480" text-anchor="middle" font-size="10" fill="#1e293b">独立摘要类消息</text>
  <text x="1060" y="480" text-anchor="middle" font-size="10" fill="#1e293b">user/message + replace 事件</text>

  <!-- Row 2 -->
  <text x="180" y="500" text-anchor="middle" font-size="10" fill="#1e293b">保留什么</text>
  <text x="470" y="500" text-anchor="middle" font-size="10" fill="#1e293b">最近 N 条原文</text>
  <text x="765" y="500" text-anchor="middle" font-size="10" fill="#1e293b">最近 ~20k tokens 原文</text>
  <text x="1060" y="500" text-anchor="middle" font-size="10" fill="#1e293b">最近 ~16% 窗口</text>

  <!-- Row 3 -->
  <text x="180" y="520" text-anchor="middle" font-size="10" fill="#1e293b">递归？</text>
  <text x="470" y="520" text-anchor="middle" font-size="10" fill="#1e293b">会（previousSummary 递归）</text>
  <text x="765" y="520" text-anchor="middle" font-size="10" fill="#1e293b">会（递归 + details 文件清单）</text>
  <text x="1060" y="520" text-anchor="middle" font-size="10" fill="#1e293b">不会（永远单块）</text>

  <!-- Row 4 -->
  <text x="180" y="540" text-anchor="middle" font-size="10" fill="#1e293b">增量更新</text>
  <text x="470" y="540" text-anchor="middle" font-size="10" fill="#1e293b">previousSummary 提示词递归</text>
  <text x="765" y="540" text-anchor="middle" font-size="10" fill="#1e293b">同 + split-turn 前缀摘要</text>
  <text x="1060" y="540" text-anchor="middle" font-size="10" fill="#1e293b">指令内合并单块</text>
</svg>
