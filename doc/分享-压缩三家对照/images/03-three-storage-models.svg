<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arr3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b82f6"/>
    </marker>
    <marker id="arr3g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
    <marker id="arr3o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="640" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1e293b">图一：三家存储模型（为什么切法不同——地基）</text>

  <!-- Column 1: 我们 -->
  <rect x="20" y="55" width="390" height="370" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="20" y="55" width="390" height="36" rx="12" fill="#3b82f6"/>
  <text x="215" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">我们 agent-learn</text>

  <rect x="40" y="105" width="350" height="52" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="215" y="125" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">JSONL 会话文件</text>
  <text x="215" y="143" text-anchor="middle" font-size="11" fill="#1e40af">只追加，永不删（树结构）</text>

  <line x1="215" y1="160" x2="215" y2="172" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr3b)"/>

  <rect x="40" y="175" width="350" height="52" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="215" y="195" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">内存：消息树</text>
  <text x="215" y="213" text-anchor="middle" font-size="11" fill="#1e40af">id + parentId 关联</text>

  <line x1="215" y1="230" x2="215" y2="242" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr3b)"/>

  <rect x="40" y="245" width="350" height="52" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="215" y="265" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">buildContext() 从叶子回溯</text>
  <text x="215" y="283" text-anchor="middle" font-size="11" fill="#1e40af">遇 compaction entry → 跳过旧消息</text>

  <line x1="215" y1="300" x2="215" y2="312" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr3b)"/>

  <rect x="40" y="315" width="350" height="52" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="215" y="335" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">从 firstKeptEntryId 开始拼</text>
  <text x="215" y="353" text-anchor="middle" font-size="11" fill="#1e40af">摘要 + 最近 N 条原文</text>

  <line x1="215" y1="370" x2="215" y2="382" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arr3b)"/>

  <rect x="40" y="385" width="350" height="30" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="2"/>
  <text x="215" y="405" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">✅ 压缩后可 switchLeaf 回退分支</text>

  <!-- Column 2: pi -->
  <rect x="445" y="55" width="390" height="370" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
  <rect x="445" y="55" width="390" height="36" rx="12" fill="#10b981"/>
  <text x="640" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">pi</text>

  <rect x="465" y="105" width="350" height="52" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="640" y="125" text-anchor="middle" font-size="12" font-weight="600" fill="#047857">append-only 事件日志</text>
  <text x="640" y="143" text-anchor="middle" font-size="11" fill="#065f46">只有 append API，无删除</text>

  <line x1="640" y1="160" x2="640" y2="172" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr3g)"/>

  <rect x="465" y="175" width="350" height="52" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="640" y="195" text-anchor="middle" font-size="12" font-weight="600" fill="#047857">buildSessionContext()</text>
  <text x="640" y="213" text-anchor="middle" font-size="11" fill="#065f46">读时过滤</text>

  <line x1="640" y1="230" x2="640" y2="242" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr3g)"/>

  <rect x="465" y="245" width="350" height="52" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="640" y="265" text-anchor="middle" font-size="12" font-weight="600" fill="#047857">路径折叠成</text>
  <text x="640" y="283" text-anchor="middle" font-size="11" fill="#065f46">[最新 compaction entry, 其后条目]</text>

  <line x1="640" y1="300" x2="640" y2="312" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr3g)"/>

  <rect x="465" y="315" width="350" height="52" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="640" y="335" text-anchor="middle" font-size="12" font-weight="600" fill="#047857">retainedTail 内联拷贝近尾</text>
  <text x="640" y="353" text-anchor="middle" font-size="11" fill="#065f46">或 firstKeptEntryId 指针</text>

  <line x1="640" y1="370" x2="640" y2="382" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr3g)"/>

  <rect x="465" y="385" width="350" height="30" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="2"/>
  <text x="640" y="405" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">✅ 日志是唯一真相</text>

  <!-- Column 3: DSH -->
  <rect x="870" y="55" width="390" height="370" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
  <rect x="870" y="55" width="390" height="36" rx="12" fill="#f59e0b"/>
  <text x="1065" y="78" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">DSH</text>

  <rect x="890" y="105" width="350" height="52" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="1065" y="125" text-anchor="middle" font-size="12" font-weight="600" fill="#b45309">append-only 事件日志</text>
  <text x="1065" y="143" text-anchor="middle" font-size="11" fill="#92400e">真相，永不删</text>

  <line x1="1065" y1="160" x2="1065" y2="172" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arr3o)"/>

  <rect x="890" y="175" width="350" height="52" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="1065" y="195" text-anchor="middle" font-size="12" font-weight="600" fill="#b45309">surface 折叠视图</text>
  <text x="1065" y="213" text-anchor="middle" font-size="11" fill="#92400e">模型可见，派生数据</text>

  <line x1="1065" y1="230" x2="1065" y2="242" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arr3o)"/>

  <rect x="890" y="245" width="350" height="52" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="1065" y="265" text-anchor="middle" font-size="12" font-weight="600" fill="#b45309">压缩 = surface replace</text>
  <text x="1065" y="283" text-anchor="middle" font-size="11" fill="#92400e">最老一段 → 检查点消息</text>

  <line x1="1065" y1="300" x2="1065" y2="312" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arr3o)"/>

  <rect x="890" y="315" width="350" height="52" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="1065" y="335" text-anchor="middle" font-size="12" font-weight="600" fill="#b45309">被压旧消息 = shadowed</text>
  <text x="1065" y="353" text-anchor="middle" font-size="11" fill="#92400e">日志原封不动</text>

  <line x1="1065" y1="370" x2="1065" y2="382" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arr3o)"/>

  <rect x="890" y="385" width="350" height="30" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="1065" y="405" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">❌ 视图单向折叠，replace 不可逆</text>

  <!-- Comparison table -->
  <rect x="20" y="445" width="1240" height="160" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="40" y="470" font-size="14" font-weight="700" fill="#475569">三家对照</text>

  <!-- Table header -->
  <rect x="40" y="480" width="250" height="28" rx="4" fill="#e2e8f0"/>
  <text x="165" y="498" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">维度</text>
  <rect x="295" y="480" width="310" height="28" rx="4" fill="#dbeafe"/>
  <text x="450" y="498" text-anchor="middle" font-size="12" font-weight="600" fill="#1d4ed8">我们</text>
  <rect x="610" y="480" width="310" height="28" rx="4" fill="#d1fae5"/>
  <text x="765" y="498" text-anchor="middle" font-size="12" font-weight="600" fill="#047857">pi</text>
  <rect x="925" y="480" width="310" height="28" rx="4" fill="#fef3c7"/>
  <text x="1080" y="498" text-anchor="middle" font-size="12" font-weight="600" fill="#b45309">DSH</text>

  <!-- Row 1 -->
  <text x="165" y="525" text-anchor="middle" font-size="11" fill="#1e293b">真相存哪</text>
  <text x="450" y="525" text-anchor="middle" font-size="11" fill="#1e293b">JSONL 文件（树）</text>
  <text x="765" y="525" text-anchor="middle" font-size="11" fill="#1e293b">append-only 日志</text>
  <text x="1080" y="525" text-anchor="middle" font-size="11" fill="#1e293b">append-only 日志</text>

  <!-- Row 2 -->
  <text x="165" y="550" text-anchor="middle" font-size="11" fill="#1e293b">模型看到什么</text>
  <text x="450" y="550" text-anchor="middle" font-size="11" fill="#1e293b">buildContext 回溯结果</text>
  <text x="765" y="550" text-anchor="middle" font-size="11" fill="#1e293b">读时过滤的路径</text>
  <text x="1080" y="550" text-anchor="middle" font-size="11" fill="#1e293b">surface 折叠视图</text>

  <!-- Row 3 -->
  <text x="165" y="575" text-anchor="middle" font-size="11" fill="#1e293b">压缩 =</text>
  <text x="450" y="575" text-anchor="middle" font-size="11" fill="#1e293b">追加 compaction entry</text>
  <text x="765" y="575" text-anchor="middle" font-size="11" fill="#1e293b">追加 compaction entry</text>
  <text x="1080" y="575" text-anchor="middle" font-size="11" fill="#1e293b">surface replace + log 事件</text>

  <!-- Row 4 -->
  <text x="165" y="600" text-anchor="middle" font-size="11" fill="#1e293b">多出来的能力</text>
  <text x="450" y="600" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8">可回溯分支（switchLeaf）</text>
  <text x="765" y="600" text-anchor="middle" font-size="11" fill="#1e293b">纯日志重放</text>
  <text x="1080" y="600" text-anchor="middle" font-size="11" fill="#1e293b">审计 / 重建</text>

  <!-- Summary line -->
  <text x="640" y="615" text-anchor="middle" font-size="11" font-style="italic" fill="#64748b">一句话：我们=树，pi=纯日志，DSH=日志+视图。树的代价是"状态靠指针拼"，收益是能回退；DSH 的收益是"重放即真相"，代价是视图单向。</text>
</svg>
